  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3b7116d7-7ec8-429f-9e50-aae9806ba32c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1048d90e-61d5-483c-bc27-f572974414ca\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"60dc8850-f3e9-4ace-af5d-4c0b7583ef03\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e698d614-cb59-4ea8-9c95-ddeb786d44a6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#140911;font-family:'Space Grotesk',system-ui,sans-serif;}\n  a{color:#a81c5a;text-decoration:none;border-bottom:1px solid rgba(168,28,90,.35);}\n  a:hover{color:#7a1440;border-color:#7a1440;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section data-turn=\"3\" style=\"display:flex;flex-direction:column;gap:22px;padding:0;margin:0;align-items:stretch;width:100%;height:100%;\">\n\n  \n\n  <div id=\"1a\" data-screen-label=\"Skyline hero\" style=\"display:flex;flex-direction:column;gap:2px;width:100%;height:100%;\">\n    <div style=\"position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;background:#140911;\">\n      <img src=\"ae319eb7-49bb-40b5-85e0-71b589f7ca6e\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;filter:brightness(.5) contrast(1.08) saturate(.55);\">\n      <div style=\"position:absolute;inset:0;background:linear-gradient(150deg,#4a1230,#8a1a4a);mix-blend-mode:color;opacity:.58;\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:linear-gradient(160deg, rgba(32,11,22,.45), rgba(15,6,11,.6));\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:radial-gradient(125% 105% at 50% 8%, rgba(20,8,16,0) 40%, rgba(13,5,11,.8) 100%);\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(13,5,11,.5), rgba(13,5,11,0) 38%, rgba(13,5,11,0) 76%, rgba(13,5,11,.55));\"><\u002Fdiv>\n\n      <canvas ref=\"{{ setCity }}\" style=\"position:absolute;inset:0;width:100%;height:100%;\"><\u002Fcanvas>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.rafs = {};\n    this.cleanups = [];\n    this.setCity = (el)=>{\n      if(!el || el.__fen) return; el.__fen = true;\n      try{ this.initCity(el); }catch(e){ console.error(e); }\n    };\n  }\n\n  componentWillUnmount(){ this.cleanups.forEach(f=>{ try{ f(); }catch(e){} }); }\n\n  sizer(el, ctx){\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    const fit = ()=>{\n      const w = el.clientWidth || 620, h = el.clientHeight || 600;\n      el.width = Math.round(w*dpr); el.height = Math.round(h*dpr);\n      ctx.setTransform(dpr,0,0,dpr,0,0);\n    };\n    fit();\n    const ro = new ResizeObserver(fit); ro.observe(el);\n    this.cleanups.push(()=>ro.disconnect());\n    return ()=>({ w: el.clientWidth||620, h: el.clientHeight||600 });\n  }\n\n  loop(key, fn){\n    const step = (now)=>{ try{ fn(now); }catch(e){ console.error(e); } this.rafs[key] = requestAnimationFrame(step); };\n    try{ fn(performance.now()); }catch(e){ console.error(e); }   // paint one frame immediately\n    this.rafs[key] = requestAnimationFrame(step);\n    this.cleanups.push(()=>cancelAnimationFrame(this.rafs[key]));\n  }\n\n  rr(ctx,x,y,w,h,r){\n    r=Math.min(r,h/2,w/2);\n    ctx.beginPath();\n    ctx.moveTo(x+r,y);\n    ctx.arcTo(x+w,y,x+w,y+h,r);\n    ctx.arcTo(x+w,y+h,x,y+h,r);\n    ctx.arcTo(x,y+h,x,y,r);\n    ctx.arcTo(x,y,x+w,y,r);\n    ctx.closePath();\n  }\n\n  wrap(ctx, text, maxW){\n    const words = text.split(' ');\n    const lines = []; let cur = '';\n    for(const wd of words){\n      const test = cur ? cur+' '+wd : wd;\n      if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = wd; }\n      else cur = test;\n    }\n    if(cur) lines.push(cur);\n    return lines;\n  }\n\n  initCity(el){\n    const ctx = el.getContext('2d');\n    const size = this.sizer(el, ctx);\n    const TAU = Math.PI*2;\n\n    // anchors (lit windows) -> callout pills, in normalized card coords\n    // window+pill positions (slots); texts rotate through the POOL below\n    const CALL = [\n      { ax:0.487, ay:0.455, px:0.285, py:0.135 },\n      { ax:0.715, ay:0.445, px:0.815, py:0.165 },\n      { ax:0.345, ay:0.485, px:0.150, py:0.335 },\n      { ax:0.560, ay:0.650, px:0.560, py:0.100 },\n    ];\n    const POOL = [\n      'Ny leietaker i 3. etasje fra 10.02.2027',\n      'Felleskost er avregnet for dette bygget',\n      'Avtalen KPI-reguleres 01.01.2027',\n      'Leieavtale utl\u00f8per om 90 dager',\n      'Opsjon p\u00e5 forlengelse m\u00e5 varsles innen 01.03.2027',\n      'Husk \u00e5 reforhandle avtale',\n      'KPI-justering: +3,8 % fra 01.01.2027',\n      'Ny \u00e5rsleie beregnet og fakturert',\n      'Akonto felleskost oppdatert for 2027',\n      'Avregning klar \u2014 4 leietakere f\u00e5r tilgode',\n      'Husleie fakturert for Q1 2027',\n      'Regnskap avstemt for mars',\n      'Ledig areal i 5. etasje \u2014 420 m\u00b2',\n      'Utleiegrad: 96 % i dette bygget',\n      'Nytt arealuttrekk registrert',\n    ];\n    const PERIOD = 9, DUR_LINE = 0.7, DUR_HOLD = 3.6, DUR_FADE = 0.7;\n    const offsets = [0, 2.25, 4.5, 6.75];\n\n    // ambient glowing windows for life\n    const AMB = [];\n    const cluster = [[0.487,0.40,0.09],[0.345,0.44,0.08],[0.715,0.40,0.07],[0.56,0.60,0.10],[0.80,0.62,0.07],[0.155,0.60,0.06]];\n    for(let i=0;i<38;i++){\n      const c = cluster[i%cluster.length];\n      AMB.push({ x: c[0]+(Math.random()*2-1)*c[2]*0.7, y: c[1]+(Math.random()*2-1)*c[2]*1.4, ph: Math.random()*TAU, sp: 0.6+Math.random()*1.4, w: 2+Math.random()*2 });\n    }\n\n    const smooth = (t)=> t*t*(3-2*t);\n\n    this.loop('city',(now)=>{\n      const {w,h} = size();\n      const t = now/1000;\n      ctx.clearRect(0,0,w,h);\n\n      // ambient windows\n      for(const a of AMB){\n        const x=a.x*w, y=a.y*h;\n        const g = 0.25 + 0.4*(0.5+0.5*Math.sin(t*a.sp + a.ph));\n        const gr = ctx.createRadialGradient(x,y,0,x,y,a.w*3.4);\n        gr.addColorStop(0,'rgba(255,196,224,'+(g*0.5)+')');\n        gr.addColorStop(1,'rgba(236,106,156,0)');\n        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,a.w*3.4,0,TAU); ctx.fill();\n        ctx.fillStyle='rgba(255,222,238,'+(0.35+g*0.5)+')';\n        ctx.fillRect(x-a.w/2, y-a.w*0.7, a.w, a.w*1.4);\n      }\n\n      ctx.textBaseline='alphabetic';\n      for(let i=0;i<CALL.length;i++){\n        const c = CALL[i];\n        let lt = ((t - offsets[i]) % PERIOD); if(lt<0) lt+=PERIOD;\n        const cyc = Math.floor((t - offsets[i]) / PERIOD);\n        const text = POOL[(((cyc*CALL.length + i) % POOL.length) + POOL.length) % POOL.length];\n        const visEnd = DUR_LINE+DUR_HOLD+DUR_FADE;\n        const active = lt < visEnd;\n\n        const ax=c.ax*w, ay=c.ay*h;\n\n        // lit-window highlight at anchor (always, brighter when active)\n        const boost = active ? 1 : 0.45;\n        const wg = ctx.createRadialGradient(ax,ay,0,ax,ay,20);\n        wg.addColorStop(0,'rgba(255,206,230,'+(0.55*boost)+')');\n        wg.addColorStop(1,'rgba(236,106,156,0)');\n        ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(ax,ay,20,0,TAU); ctx.fill();\n        ctx.fillStyle='rgba(255,230,242,'+(0.7*boost)+')';\n        ctx.fillRect(ax-3, ay-6, 6, 12);\n\n        if(!active) continue;\n\n        let lineP=0, alpha=1;\n        if(lt < DUR_LINE){ lineP = smooth(lt/DUR_LINE); alpha=1; }\n        else if(lt < DUR_LINE+DUR_HOLD){ lineP=1; alpha=1; }\n        else { lineP=1; alpha = 1 - (lt-DUR_LINE-DUR_HOLD)/DUR_FADE; }\n\n        // pill geometry\n        ctx.font = \"500 12.5px 'Space Grotesk', sans-serif\";\n        const maxTextW = 190;\n        const lines = this.wrap(ctx, text, maxTextW);\n        let tw=0; for(const ln of lines) tw=Math.max(tw, ctx.measureText(ln).width);\n        const padX=14, padY=11, lh=17, dotGap=14;\n        const boxW = tw + padX*2 + dotGap;\n        const boxH = lines.length*lh + padY*2;\n        let cx = c.px*w, cy = c.py*h;\n        cx = Math.max(boxW/2+8, Math.min(w-boxW/2-8, cx));\n        cy = Math.max(boxH/2+8, Math.min(h-boxH/2-8, cy));\n\n        // join point on pill border toward anchor\n        const dx = ax-cx, dy = ay-cy;\n        const sx = (boxW/2)/(Math.abs(dx)||1e-6), sy=(boxH/2)/(Math.abs(dy)||1e-6);\n        const s = Math.min(sx,sy);\n        const jx = cx + dx*s, jy = cy + dy*s;\n\n        // connector line (anchor -> join), revealed by lineP\n        const ex = ax + (jx-ax)*lineP, ey = ay + (jy-ay)*lineP;\n        ctx.strokeStyle='rgba(236,106,156,'+(0.85*alpha)+')';\n        ctx.lineWidth=1.6; ctx.lineCap='round';\n        ctx.shadowColor='rgba(236,106,156,0.8)'; ctx.shadowBlur=8;\n        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();\n        ctx.shadowBlur=0;\n        // travelling spark\n        if(lineP<1){\n          ctx.fillStyle='rgba(255,235,244,'+alpha+')';\n          ctx.beginPath(); ctx.arc(ex,ey,2.6,0,TAU); ctx.fill();\n        }\n\n        const textA = Math.min(1, Math.max(0,(lt-DUR_LINE*0.7)/0.4)) * alpha;\n        if(textA<=0) continue;\n\n        // join dot\n        ctx.fillStyle='rgba(236,106,156,'+alpha+')';\n        ctx.beginPath(); ctx.arc(jx,jy,3,0,TAU); ctx.fill();\n\n        // pill\n        const bx=cx-boxW/2, by=cy-boxH/2;\n        this.rr(ctx,bx,by,boxW,boxH,13);\n        ctx.fillStyle='rgba(26,10,18,'+(0.88*textA)+')'; ctx.fill();\n        ctx.lineWidth=1; ctx.strokeStyle='rgba(236,106,156,'+(0.5*textA)+')'; ctx.stroke();\n        // leading dot\n        ctx.fillStyle='rgba(236,106,156,'+textA+')';\n        ctx.beginPath(); ctx.arc(bx+padX, by+padY+6, 3.4, 0, TAU); ctx.fill();\n        // text\n        ctx.fillStyle='rgba(250,240,244,'+textA+')';\n        ctx.textBaseline='middle';\n        for(let k=0;k<lines.length;k++){\n          ctx.fillText(lines[k], bx+padX+dotGap, by+padY + k*lh + lh/2);\n        }\n        ctx.textBaseline='alphabetic';\n      }\n    });\n  }\n\n  renderVals(){ return { setCity: this.setCity }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

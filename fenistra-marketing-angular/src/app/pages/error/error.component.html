<style>

  :root{
    --paper:      #FCFAFB;
    --paper-2:    #F6F3F5;
    --mist:       #EBE8EC;
    --ink:        #150A18;
    --ink-soft:   #4A3B4E;
    --plum:       #634967;
    --plum-deep:  #27122C;
    --plum-900:   #130916;
    --line:       #E4DEE1;
    --berry:      #AB3164;
    --berry-deep: #7B173E;
    --berry-900:  #560022;
    --berry-light:#F8EAEE;
    --berry-mid:  #BC5A83;
    --font-display: 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --container: 1180px;
    --radius: 14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  .wrap{max-width:var(--container);margin:0 auto;padding:0 32px;}
  ::selection{background:var(--berry);color:#fff;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--berry);outline-offset:3px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}}

  .eyebrow{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--berry-deep);
    background:var(--berry-light);
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 14px 7px 12px;
    border-radius:20px;
    margin-bottom:20px;
    line-height:1.3;
  }
  .eyebrow::before{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--berry);
    display:inline-block;
    flex-shrink:0;
  }
  .glyph{display:block;} .glyph rect{fill:currentColor;}

  header{position:sticky;top:0;z-index:100;background:rgba(252,250,251,0.86);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .brand{display:flex;align-items:center;}
  .brand-logo{height:28px;width:auto;display:block;}
  .nav-links{display:flex;align-items:center;gap:36px;}
  .nav-links a{font-size:14.5px;font-weight:500;color:var(--ink-soft);position:relative;padding:6px 0;transition:color .2s ease;}
  .nav-links a:hover, .nav-links a.active{color:var(--ink);}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--berry);transition:width .25s ease;}
  .nav-links a:hover::after, .nav-links a.active::after{width:100%;}
  .nav-cta{display:flex;align-items:center;gap:22px;}
  .nav-cta .login{font-size:14.5px;font-weight:500;color:var(--ink-soft);}
  .nav-cta .login:hover{color:var(--ink);}
  .hamburger{display:none;}

  /* ================= NAV DROPDOWNS ================= */
  .nav-item-dropdown{position:relative;}
  .nav-trigger{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:inherit;padding:6px 0;transition:color .2s ease;}
  .nav-trigger:hover{color:var(--ink);}
  .nav-trigger svg{transition:transform .2s ease;flex-shrink:0;}
  .nav-item-dropdown:hover .nav-trigger svg, .nav-item-dropdown:focus-within .nav-trigger svg{transform:rotate(180deg);}
  .nav-item-dropdown.nav-active > .nav-trigger{color:var(--ink);}
  .nav-panel{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;padding-top:14px;z-index:120;}
  .nav-item-dropdown:hover .nav-panel, .nav-item-dropdown:focus-within .nav-panel{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .nav-panel-inner{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 60px -20px rgba(21,10,24,.35);padding:12px;}
  .nav-panel-mega{width:480px;}
  .nav-mega-item{display:flex;gap:14px;padding:12px;border-radius:12px;transition:background .15s ease;}
  .nav-mega-item:hover{background:var(--paper-2);}
  .nav-mega-icon{width:38px;height:38px;border-radius:10px;background:var(--berry-light);color:var(--berry-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-mega-text h4{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .nav-mega-text p{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .nav-mega-all{display:block;margin-top:4px;padding:12px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:12.5px;color:var(--berry-deep);font-weight:600;text-align:center;border-radius:0 0 10px 10px;}
  .nav-panel-simple{width:210px;}
  .nav-panel-simple a{display:block;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--ink);transition:background .15s ease, color .15s ease;}
  .nav-panel-simple a:hover{background:var(--paper-2);color:var(--berry-deep);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:9px;transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background .25s ease, border-color .25s ease;white-space:nowrap;}
  .btn-primary{background:var(--berry);color:#fff;box-shadow:0 1px 2px rgba(86,0,34,0.15), 0 8px 20px -10px rgba(171,49,100,0.55);}
  .btn-primary:hover{background:var(--berry-deep);transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(123,23,62,0.55);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--plum);background:var(--paper-2);transform:translateY(-1px);}

  @media (max-width:1080px){
    .nav-links{display:none;}
    .hamburger{display:flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);}
    .hamburger span{position:relative;width:16px;height:1.5px;background:var(--ink);display:block;}
    .hamburger span::before,.hamburger span::after{content:"";position:absolute;width:16px;height:1.5px;background:var(--ink);left:0;}
    .hamburger span::before{top:-5px;} .hamburger span::after{top:5px;}
    .nav-cta .login{display:none;}
  }

  /* ================= ERROR PAGE ================= */
  .error-hero{padding:min(18vh,140px) 0 min(14vh,110px);text-align:center;}
  .error-hero .wrap{max-width:640px;}
  .error-code{
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--berry-deep);
    background:var(--berry-light);
    display:inline-flex;
    padding:7px 16px;
    border-radius:20px;
    margin-bottom:28px;
  }
  .error-glyph{font-family:var(--font-display);font-weight:300;font-size:clamp(64px,12vw,120px);letter-spacing:-0.03em;color:var(--mist);line-height:1;margin-bottom:8px;}
  .error-hero h1{font-family:var(--font-display);font-weight:300;font-size:clamp(28px,3.6vw,40px);letter-spacing:-0.02em;color:var(--ink);margin-bottom:16px;}
  .error-hero p{font-size:17px;color:var(--ink-soft);margin:0 auto 36px;max-width:480px;}
  .error-hero .hero-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
</style>

<section class="error-hero">
  <div class="wrap">
    <div class="error-glyph">{{ code }}</div>
    <div class="error-code">Feil {{ code }}</div>
    <h1>{{ info.title }}</h1>
    <p>{{ info.message }}</p>
    <div class="hero-actions">
      <a routerLink="/" class="btn btn-primary">Gå til forsiden</a>
      <a routerLink="/kontakt-oss" class="btn btn-ghost">Kontakt oss</a>
    </div>
  </div>
</section>

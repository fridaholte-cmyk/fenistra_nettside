@if (unlocked) {
  <a class="skip-link" href="#hovedinnhold" (click)="skipToMain($event)">Hopp til hovedinnhold</a>
  <app-header></app-header>
  <main id="hovedinnhold" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
  @if (pageLoading) {
    <div class="page-loader"><app-loader></app-loader></div>
  }
  <app-footer></app-footer>
  <app-chat-widget></app-chat-widget>
  <app-quiz-widget></app-quiz-widget>
  <app-cookie-banner></app-cookie-banner>
} @else {
  <div class="gate">
    <form class="gate-card" (ngSubmit)="submitPassword()">
      <div class="gate-brand">FENISTRA</div>
      <h1>Forhåndsvisning</h1>
      <p>Denne siden er ikke offentlig ennå. Skriv inn passordet du har fått for å fortsette.</p>
      <input
        type="password"
        name="password"
        placeholder="Passord"
        [(ngModel)]="passwordInput"
        autocomplete="off"
        autofocus
      >
      @if (passwordError) {
        <p class="gate-error">Feil passord. Prøv igjen.</p>
      }
      <button type="submit">Fortsett</button>
    </form>
  </div>
}

<div class="chat-backdrop" id="chatBackdrop" [class.open]="open" (click)="closeChat()"></div>
<button class="chat-trigger" id="chatTrigger" aria-label="Åpne chat" [class.chat-open-hide]="open" (click)="openChat()">
  <svg width="24" height="24" aria-hidden="true" focusable="false" viewBox="0 0 512 512" fill="currentColor"><path d="M179.2 533.6s0 0 0 0l-6.4 4.8c-4.8 3.6-10.7 5.6-16.8 5.6-15.5 0-28-12.5-28-28l0-68-32 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l320 0c53 0 96 43 96 96l0 224c0 53-43 96-96 96l-120 0c-1.7 0-3.4 .6-4.8 1.6l-112 84zM160 468l0 40 112-84c6.9-5.2 15.3-8 24-8l120 0c35.3 0 64-28.7 64-64l0-224c0-35.3-28.7-64-64-64L96 64c-35.3 0-64 28.7-64 64l0 224c0 35.3 28.7 64 64 64l40 0c13.3 0 24 10.7 24 24l0 28z"/></svg>
</button>
<div class="chat-panel" id="chatPanel" role="dialog" aria-label="Chat med Fenistra" [class.open]="open">
  <div class="chat-header">
    <div>
      <h4>Fenistra-assistenten</h4>
      <p>Spør om løsninger, integrasjoner og pakker</p>
    </div>
    <button class="chat-close" id="chatClose" aria-label="Lukk chat" (click)="closeChat()">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages" #messagesEl (click)="onMessagesClick($event)">
    @for (msg of messages; track $index) {
      <div class="chat-msg chat-msg-{{ msg.who }}" [innerHTML]="msg.html"></div>
      @if (msg.suggestions) {
        <div class="chat-suggestions">
          @for (s of msg.suggestions; track s) {
            <button type="button" class="chat-suggestion" (click)="handleSend(s)">{{ s }}</button>
          }
        </div>
      }
    }
  </div>
  <form class="chat-form" id="chatForm" (ngSubmit)="submitForm()">
    <input type="text" id="chatInput" #chatInputEl placeholder="Skriv en melding …" autocomplete="off" [(ngModel)]="draft" name="draft">
    <button type="submit" aria-label="Send"><svg width="16" height="16" aria-hidden="true" focusable="false" viewBox="0 0 512 512" fill="currentColor"><path d="M507.3 267.3c6.2-6.2 6.2-16.4 0-22.6l-176-176c-6.2-6.2-16.4-6.2-22.6 0s-6.2 16.4 0 22.6L457.4 240 16 240c-8.8 0-16 7.2-16 16s7.2 16 16 16l441.4 0-148.7 148.7c-6.2 6.2-6.2 16.4 0 22.6s16.4 6.2 22.6 0l176-176z"/></svg></button>
  </form>
  @if (logger.active) {
    <p class="chat-notice">Spørsmålene lagres for å forbedre svarene våre. Ikke skriv personopplysninger. <a routerLink="/personvern" (click)="closeChat()">Les mer</a></p>
  }
</div>

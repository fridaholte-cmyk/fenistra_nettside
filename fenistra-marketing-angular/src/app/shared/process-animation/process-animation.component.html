<!-- Animated stage (built in the browser); purely visual, the same content is in the list below -->
<div class="pa-frame">
  <div class="pa-stage" aria-hidden="true"></div>
  <button type="button" class="pa-toggle" (click)="togglePause()" [attr.aria-pressed]="paused()"
          [attr.aria-label]="paused() ? 'Spill av prosessanimasjonen' : 'Sett prosessanimasjonen på pause'">
    @if (paused()) {
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>
      <span>Spill av</span>
    } @else {
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>
      <span>Pause</span>
    }
  </button>
</div>

<!-- Text version: shown on small screens and before the stage is built, read by screen readers and search engines -->
<div class="pa-fallback">
  <h2>Hele leieforholdet i ett system.</h2>
  <p class="pa-lead">Fra lead og visning til kontrakt, fakturering, regulering og avregning.</p>
  <ol class="pa-list">
    @for (s of steps; track s.key) {
      <li><h3>{{ s.title }}</h3><p>{{ s.desc }}</p></li>
    }
  </ol>
</div>
